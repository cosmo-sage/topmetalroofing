name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.11
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          script: |
            cd /var/repos/topmetalroofing.com.git
            GIT_WORK_TREE=/var/www/topmetalroofing.com git checkout -f main
            cd /var/www/topmetalroofing.com
            npm install --silent
            npm run build
            echo "Deploy complete at $(date)"
